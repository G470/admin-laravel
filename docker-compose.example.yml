version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: laravel_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel_password}
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"  # Only needed for external access
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - laravel_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-allowed-packet=256M
      --innodb-buffer-pool-size=512M

  # Uncomment and configure if you want to run Laravel app locally with docker-compose
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: laravel_app
  #   restart: unless-stopped
  #   depends_on:
  #     mariadb:
  #       condition: service_healthy
  #   networks:
  #     - laravel_network
  #   ports:
  #     - "80:80"
  #   environment:
  #     DB_CONNECTION: mariadb
  #     DB_HOST: mariadb
  #     DB_PORT: 3306
  #     DB_DATABASE: ${DB_DATABASE:-laravel}
  #     DB_USERNAME: ${DB_USERNAME:-laravel_user}
  #     DB_PASSWORD: ${DB_PASSWORD:-laravel_password}
  #   volumes:
  #     - ./storage:/var/www/html/storage
  #     - ./bootstrap/cache:/var/www/html/bootstrap/cache

networks:
  laravel_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local

